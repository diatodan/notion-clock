<!DOCTYPE html>
<html>
<body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#383836;color:white;font-size:40px;">
<div id="clock"></div>

<script>
function updateDate() {
  const now = new Date();
  const options = { day: 'numeric', month: 'long', year: 'numeric' };
  const dateFR = now.toLocaleDateString('fr-FR', options);
  document.getElementById("clock").textContent = dateFR;
}

updateDate();
</script>
</body>
</html>
